resources:
  jobs:
    job_formula1_lakehouse_full_refresh:
      name: job_formula1_lakehouse_full_refresh
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - formula1_catalog.control.batch_events
      tasks:
        - task_key: 01_Ingest_Circuits_File
          notebook_task:
            notebook_path: /Workspace/Users/trivenipinninti3@gmail.com/databricks-course/formula1-project/02-Bronze/01.Ingest
              Circuits File
            source: WORKSPACE
          job_cluster_key: Job_cluster
        - task_key: 01_Transform_Circuits_Data
          depends_on:
            - task_key: 01_Ingest_Circuits_File
          notebook_task:
            notebook_path: /Workspace/Users/trivenipinninti3@gmail.com/databricks-course/formula1-project/03-Silver/01.Transform
              Circuits Data
            source: WORKSPACE
          job_cluster_key: Job_cluster
